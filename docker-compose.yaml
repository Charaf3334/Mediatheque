services:
  app:
    build: .
    ports: ["8000:80"]
    volumes: [".:/var/www/html"]
    environment:
      DATABASE_URL: "mysql://app:app@db:3306/library?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost/login"]
      interval: 5s
      timeout: 5s
      retries: 60
      start_period: 120s
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes:
      - db:/var/lib/mysql
      - ./docker/mysql-init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 30s
volumes:
  db:
