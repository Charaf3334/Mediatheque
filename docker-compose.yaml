services:
  app:
    build: .
    ports: ["8000:80"]
    volumes: [".:/var/www/html"]
    environment:
      DATABASE_URL: "mysql://app:app@db:3306/library?serverVersion=8.0&charset=utf8mb4"
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: library
      MYSQL_USER: app
      MYSQL_PASSWORD: app
      MYSQL_ROOT_PASSWORD: root
    volumes: ["db:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      retries: 20
volumes:
  db: